    <style>
        /* 404 页面专属样式 */
        .error-wrap {
            min-height: calc(100vh - 200px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 20px 40px;
            text-align: center;
        }
        .error-inner {
            max-width: 560px;
        }
        .error-code {
            font-size: clamp(80px, 18vw, 160px);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #1abc9c, #16a085);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            margin-bottom: 8px;
            letter-spacing: -4px;
        }
        .error-title {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .error-desc {
            font-size: 15px;
            color: #7f8c8d;
            margin-bottom: 32px;
            line-height: 1.7;
        }
        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }
        .error-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.25s ease;
            min-height: 44px;
        }
        .error-btn-primary {
            background: linear-gradient(135deg, #1abc9c, #16a085);
            color: #fff;
            box-shadow: 0 4px 12px rgba(26, 188, 156, 0.3);
        }
        .error-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(26, 188, 156, 0.4);
        }
        .error-btn-primary:active {
            transform: translateY(0) scale(0.97);
        }
        .error-btn-secondary {
            background: rgba(26, 188, 156, 0.1);
            color: #16a085;
            border: 1px solid rgba(26, 188, 156, 0.3);
        }
        .error-btn-secondary:hover {
            background: rgba(26, 188, 156, 0.18);
            transform: translateY(-2px);
        }
        .error-btn-secondary:active {
            transform: translateY(0) scale(0.97);
        }
        .error-suggestions {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            border-left: 4px solid #1abc9c;
            text-align: left;
        }
        .error-suggestions h3 {
            font-size: 16px;
            color: #2c3e50;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .error-suggestions ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 8px;
        }
        .error-suggestions li a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 8px;
            color: #2c3e50;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s ease;
            background: rgba(26, 188, 156, 0.05);
            min-height: 44px;
        }
        .error-suggestions li a:hover {
            background: rgba(26, 188, 156, 0.15);
            transform: translateX(4px);
            color: #16a085;
        }
        .error-suggestions li a i {
            color: #1abc9c;
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        /* 暗色模式 */
        body.dark-mode .error-title { color: #f3f4f6; }
        body.dark-mode .error-desc { color: #9ca3af; }
        body.dark-mode .error-suggestions {
            background: #1f2937;
            border-left-color: #38bdf8;
        }
        body.dark-mode .error-suggestions h3 { color: #f3f4f6; }
        body.dark-mode .error-suggestions li a {
            color: #f3f4f6;
            background: rgba(56, 189, 248, 0.08);
        }
        body.dark-mode .error-suggestions li a:hover {
            background: rgba(56, 189, 248, 0.18);
            color: #38bdf8;
        }
        body.dark-mode .error-suggestions li a i { color: #38bdf8; }
        body.dark-mode .error-btn-secondary {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            border-color: rgba(56, 189, 248, 0.3);
        }
        body.dark-mode .error-btn-secondary:hover {
            background: rgba(56, 189, 248, 0.18);
        }
        body.dark-mode .error-btn-primary {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }
        body.dark-mode .error-btn-primary:hover {
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.4);
        }

        @media (max-width: 480px) {
            .error-actions { flex-direction: column; }
            .error-btn { width: 100%; justify-content: center; }
        }
