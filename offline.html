    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --color-primary: #1abc9c;
            --color-primary-dark: #16a085;
            --color-text: #2c3e50;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --color-primary: #38bdf8;
                --color-primary-dark: #0ea5e9;
                --color-text: #f3f4f6;
            }
            body { background: #111827; }
            .offline-card { background: #1f2937; }
            .offline-btn-secondary { background: rgba(56,189,248,0.1); color: #38bdf8; border-color: rgba(56,189,248,0.3); }
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--color-text);
            -webkit-font-smoothing: antialiased;
        }
        .offline-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.16);
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            border-top: 4px solid var(--color-primary);
        }
        .offline-icon {
            font-size: 72px;
            line-height: 1;
            margin-bottom: 20px;
            display: inline-block;
        }
        .offline-icon svg {
            width: 72px;
            height: 72px;
            fill: var(--color-primary);
        }
        .offline-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .offline-desc {
            font-size: 14px;
            line-height: 1.7;
            color: #6b7280;
            margin-bottom: 28px;
        }
        .offline-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .offline-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.25s ease;
            min-height: 44px;
            cursor: pointer;
            border: none;
        }
        .offline-btn-primary {
            background: linear-gradient(135deg, #1abc9c, #16a085);
            color: #fff;
            box-shadow: 0 4px 12px rgba(26,188,156,0.3);
        }
        .offline-btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(26,188,156,0.4); }
        .offline-btn-primary:active { transform: scale(0.97); }
        .offline-btn-secondary {
            background: rgba(26,188,156,0.1);
            color: #16a085;
            border: 1px solid rgba(26,188,156,0.3);
        }
        .offline-btn-secondary:hover { background: rgba(26,188,156,0.18); transform: translateY(-2px); }
        @media (prefers-color-scheme: dark) {
            .offline-desc { color: #9ca3af; }
        }
    </style>
</head>

<body>
    <main class="offline-card">
        <div class="offline-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 3C7 3 2.7 6.1 1 10.5l2 1.5C4.4 8.5 7.9 6 12 6s7.6 2.5 9 6l2-1.5C21.3 6.1 17 3 12 3zm0 6c-2.8 0-5.2 1.7-6.2 4.2l2 1.5C8.9 13.3 10.3 12 12 12s3.1 1.3 4.2 2.7l2-1.5C17.2 10.7 14.8 9 12 9zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </div>
        <h1 class="offline-title">您已离线</h1>
        <p class="offline-desc">
            当前网络不可用，无法加载最新内容。<br>
            您仍可浏览之前访问过的缓存页面。
        </p>
        <div class="offline-actions">
            <button class="offline-btn offline-btn-primary" onclick="location.reload()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                重新加载
            </button>
            <a href="index.html" class="offline-btn offline-btn-secondary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                返回首页
            </a>
        </div>
    </main>
</body>

</html>
